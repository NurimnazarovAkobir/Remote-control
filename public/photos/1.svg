  <!-- Person silhouette portrait standing -->
  <g transform="translate(520, 440) scale(0.95)">
    <circle cx="60" cy="50" r="24" fill="#3e2723"/>
    <path d="M35,74 C35,74 50,70 75,70 C100,70 110,80 110,120 L110,240 L80,240 L80,380 L50,380 L50,240 L35,240 Z" fill="#37474f"/>
    <path d="M45,95 L95,95 L95,240 L45,240 Z" fill="#212121"/>
