<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="60%" stop-color="#e1f5fe"/>
      <stop offset="100%" stop-color="#b3e5fc"/>
    </linearGradient>
    <linearGradient id="lake3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00acc1"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#sky3)"/>
  <!-- Snowy mountain peaks -->
  <polygon points="-50,420 150,180 350,420" fill="#eceff1"/>
  <polygon points="150,180 200,240 120,260" fill="#ffffff"/>
  <polygon points="250,420 480,150 700,420" fill="#cfd8dc"/>
  <polygon points="480,150 540,220 440,240" fill="#ffffff"/>
  <!-- Blue Lake Reservoir -->
  <path d="M0,400 Q400,380 800,420 L800,600 L0,600 Z" fill="url(#lake3)"/>
  <!-- Earth / Shore hill -->
  <path d="M-50,550 Q300,500 850,580 L850,800 L-50,800 Z" fill="#795548"/>
  <!-- Person portrait -->
  <g transform="translate(180, 240) scale(0.9)">
    <!-- Black Coat -->
    <path d="M80,120 Q160,110 240,120 L280,480 L40,480 Z" fill="#1a1a1a"/>
    <!-- Cap -->
    <ellipse cx="160" cy="80" rx="45" ry="25" fill="#333333"/>
    <path d="M160,75 Q210,75 220,90 L160,90 Z" fill="#222222"/>
  </g>
</svg>