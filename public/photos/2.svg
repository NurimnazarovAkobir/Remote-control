<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="60%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#112240"/>
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffe082" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffe082" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#nightSky)"/>
  <circle cx="280" cy="220" r="180" fill="url(#lightGlow)"/>
  <rect x="0" y="520" width="800" height="280" fill="#1c2541"/>
  <!-- White Sedan Car -->
  <g transform="translate(40, 320)">
    <!-- Car body -->
    <path d="M40,240 Q120,230 220,160 Q340,130 520,150 Q620,180 680,220 Q720,240 730,280 L730,340 L20,340 L20,280 Z" fill="#eceff1"/>
    <!-- Windows -->
    <path d="M230,165 Q330,140 500,158 Q570,185 600,220 L230,220 Z" fill="#263238"/>
    <!-- Wheels -->
    <circle cx="160" cy="340" r="60" fill="#101010"/>
    <circle cx="160" cy="340" r="35" fill="#37474f"/>
    <circle cx="590" cy="340" r="60" fill="#101010"/>
    <circle cx="590" cy="340" r="35" fill="#37474f"/>
    <!-- Headlight glow -->
    <ellipse cx="40" cy="280" rx="20" ry="12" fill="#fff9c4"/>
  </g>
</svg>