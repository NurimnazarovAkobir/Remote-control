<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="100%" stop-color="#81d4fa"/>
    </linearGradient>
    <linearGradient id="mountain4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky4)"/>
  <!-- Green Mountains background -->
  <path d="M-50,500 Q200,300 500,420 T850,380 L850,700 L-50,700 Z" fill="url(#mountain4)"/>
  <path d="M0,600 Q400,550 800,580 L800,750 L0,750 Z" fill="#00838f" opacity="0.8"/>
  <!-- Selfie Portrait foreground -->
  <g transform="translate(150, 260) scale(1.2)">
    <!-- T-shirt -->
    <path d="M60,260 Q200,240 340,260 L360,500 L40,500 Z" fill="#263238"/>
    <!-- Head/Face -->
    <ellipse cx="200" cy="160" rx="85" ry="105" fill="#d7ccc8"/>
    <!-- Hair -->
    <path d="M115,140 Q200,60 285,140 Q200,100 115,140 Z" fill="#212121"/>
    <!-- Glasses -->
    <rect x="135" y="140" width="55" height="35" rx="5" fill="none" stroke="#37474f" stroke-width="6"/>
    <rect x="210" y="140" width="55" height="35" rx="5" fill="none" stroke="#37474f" stroke-width="6"/>
    <line x1="190" y1="155" x2="210" y2="155" stroke="#37474f" stroke-width="6"/>
  </g>
</svg>